apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp
  namespace: postgres-mcp
  labels:
    app: postgres-mcp
    app.kubernetes.io/name: postgres-mcp
    app.kubernetes.io/part-of: topmate-mcp
spec:
  # S1: stateless /mcp (stateless_http=True) — inter-MCP callers use the
  # session-free streamable path, so multiple replicas are safe behind the
  # non-sticky in-cluster Service. External SSE callers keep ALB lb_cookie
  # stickiness. Requires the db-mcp POSTGRES_MCP_TRANSPORT=streamable_http flip.
  replicas: 3
  selector:
    matchLabels:
      app: postgres-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app: postgres-mcp
        app.kubernetes.io/name: postgres-mcp
    spec:
      serviceAccountName: postgres-mcp-sa
      containers:
        - name: postgres-mcp
          image: 072528252688.dkr.ecr.ap-south-1.amazonaws.com/topmate-postgres-mcp:latest
          args:
            - "--transport=sse"
            - "--sse-host=0.0.0.0"
            - "--sse-port=8000"
            - "--access-mode=restricted"
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: database-uri
            - name: ACCESS_MODE
              value: "restricted"
            - name: TRANSPORT
              value: "sse"
            - name: PORT
              value: "8000"
            - name: TOPMATE_LOGIC_HUB_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: logic-hub-url
            - name: TOPMATE_LOGIC_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: logic-hub-api-key
            - name: ALLOWED_IPS
              valueFrom:
                configMapKeyRef:
                  name: postgres-mcp-allowlist
                  key: allowed-ips
            # Static Bearer token that bypasses the IP allowlist (shared with db-mcp).
            # Holders can reach postgres-mcp from any IP (e.g. staging EC2, CI).
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: auth-token
                  optional: true
            # --- Caller-scoped access (Loop end-user identity forwarding) ---
            # Validates Authorization: Token <x> against galactus /profile/.
            # postgres-mcp is admin-only: any non-superadmin scope is 403'd.
            - name: CALLER_SCOPE_ENABLED
              value: "true"
            - name: GALACTUS_PROFILE_URL
              value: "https://api.galactus.run/profile/"
            - name: SUPERADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: superadmin-emails
                  optional: true
            - name: SUPERADMIN_TOKENS
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: superadmin-tokens
                  optional: true
            # --- G1/G3: Loop-signed identity JWT (verify side) ---
            # Flip REQUIRE_SIGNED_IDENTITY to "true" only after Loop ships signing
            # (sends X-Identity-JWT). See docs/LOOP_SIGNED_IDENTITY_CONTRACT.md.
            - name: REQUIRE_SIGNED_IDENTITY
              value: "false"
            - name: IDENTITY_JWT_AUDIENCE
              value: "topmate-mcp"
            - name: IDENTITY_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: identity-jwt-public-key
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1500m"   # S1: raise the 0.5-vCPU cap so each replica can drive its pool
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
