apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp
  namespace: postgres-mcp
  labels:
    app: postgres-mcp
    app.kubernetes.io/name: postgres-mcp
    app.kubernetes.io/part-of: topmate-mcp
spec:
  # PINNED TO 1 — do not raise without a shared session store.
  # External callers use the stateful /sse transport, whose session_id->stream
  # map is in-memory per pod. ALB lb_cookie stickiness does NOT pin them: the
  # EventSource GET and the message POSTs are separate requests that never replay
  # the AWSALB cookie, so with >1 replica ~50% of POSTs land on the wrong pod
  # (404 "Could not find session") and the client handshake times out at 30s.
  # Re-enable scale-out only after external callers move to the stateless /mcp
  # (streamable_http) path OR /sse sessions are backed by a shared store (Redis).
  replicas: 1
  selector:
    matchLabels:
      app: postgres-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app: postgres-mcp
        app.kubernetes.io/name: postgres-mcp
    spec:
      serviceAccountName: postgres-mcp-sa
      containers:
        - name: postgres-mcp
          image: 072528252688.dkr.ecr.ap-south-1.amazonaws.com/topmate-postgres-mcp:latest
          args:
            - "--transport=sse"
            - "--sse-host=0.0.0.0"
            - "--sse-port=8000"
            - "--access-mode=restricted"
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: database-uri
            - name: ACCESS_MODE
              value: "restricted"
            - name: TRANSPORT
              value: "sse"
            - name: PORT
              value: "8000"
            # POOL: per-replica psycopg pool sizing (tunable without rebuild).
            # ⚠ Raise DB_POOL_MAX_SIZE (e.g. 30) only after verifying RDS
            # max_connections + pg_stat_activity headroom (replica shared w/ Django).
            - name: DB_POOL_MIN_SIZE
              value: "5"
            - name: DB_POOL_MAX_SIZE
              value: "20"
            - name: DB_POOL_TIMEOUT
              value: "10.0"
            - name: TOPMATE_LOGIC_HUB_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: logic-hub-url
            - name: TOPMATE_LOGIC_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: logic-hub-api-key
            - name: ALLOWED_IPS
              valueFrom:
                configMapKeyRef:
                  name: postgres-mcp-allowlist
                  key: allowed-ips
            # Static Bearer token that bypasses the IP allowlist (shared with db-mcp).
            # Holders can reach postgres-mcp from any IP (e.g. staging EC2, CI).
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: auth-token
                  optional: true
            # LOOP-664 M1: per-person auth. LIVE in prod. This is the access gate in
            # front of the M3 multi-domain router, so it MUST stay "true" (disabling
            # it removes the gate). The base manifest previously drifted to "false"
            # while prod ran "true"; corrected 2026-07-25 so a full deploy.sh apply
            # cannot regress it. See the internal design spec for rationale.
            - name: PERSON_AUTH_ENABLED
              value: "true"
            - name: PERSON_TOKENS
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: person-tokens
                  optional: true
            # --- Caller-scoped access (Loop end-user identity forwarding) ---
            # Validates Authorization: Token <x> against galactus /profile/.
            # postgres-mcp is admin-only: any non-superadmin scope is 403'd.
            - name: CALLER_SCOPE_ENABLED
              value: "true"
            - name: GALACTUS_PROFILE_URL
              value: "https://api.galactus.run/profile/"
            - name: SUPERADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: superadmin-emails
                  optional: true
            - name: SUPERADMIN_TOKENS
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: superadmin-tokens
                  optional: true
            # --- G1/G3: Loop-signed identity JWT (verify side) ---
            # Flip REQUIRE_SIGNED_IDENTITY to "true" only after Loop ships signing
            # (sends X-Identity-JWT). See docs/LOOP_SIGNED_IDENTITY_CONTRACT.md.
            - name: REQUIRE_SIGNED_IDENTITY
              value: "false"
            - name: IDENTITY_JWT_AUDIENCE
              value: "topmate-mcp"
            - name: IDENTITY_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: identity-jwt-public-key
                  optional: true
            # LOOP-664 M3: multi-DB router — proxies to the sibling per-DB MCPs over
            # intra-cluster /mcp. Transport is streamable_http (stateless), not SSE.
            # The router presents no separate service token to downstreams; inbound
            # person-auth (PERSON_AUTH_ENABLED, above) is the access gate. The
            # downstream trust-boundary rationale lives in the internal design spec.
            - name: MULTI_DOMAIN_ENABLED
              value: "true"
            # Service DNS is intra-namespace (postgres-mcp), so short names resolve.
            # All Services below expose port 80 -> targetPort 8000 (no :8000 suffix
            # on base_url); the downstream client appends /mcp itself.
            # `loop` is the one out-of-cluster domain: ryl-beta-db lives in
            # ryl-beta-vpc with no peering to this VPC, so it is reached over
            # HTTPS via a sidecar MCP running inside that VPC. That hop is
            # public, so unlike the in-cluster entries it MUST carry a bearer
            # (token_env) and the sidecar MUST run PERSON_AUTH_ENABLED=true --
            # an empty ALLOWED_IPS means allow-all, and AUTH_TOKEN only
            # *bypasses* the IP check, it never *requires* a token.
            - name: DOMAIN_REGISTRY_JSON
              value: >-
                {"igdm":{"base_url":"http://instagram-mcp-service","transport":"streamable_http","database":"instagram_auto_dm"},"fin_ledger":{"base_url":"http://postgres-mcp-v2-ledger-service","transport":"streamable_http","database":"ledger_db"},"fin_payment":{"base_url":"http://postgres-mcp-v2-payment-service","transport":"streamable_http","database":"payment_db"},"fin_payout":{"base_url":"http://postgres-mcp-v2-payout-service","transport":"streamable_http","database":"payout_db"},"loop":{"base_url":"https://loop-mcp.ryloop.co","transport":"streamable_http","database":"ryl_beta","token_env":"LOOP_MCP_TOKEN"}}
            - name: LOOP_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: loop-mcp-token
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1500m"   # S1: raise the 0.5-vCPU cap so each replica can drive its pool
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
