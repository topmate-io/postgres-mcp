apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp
  namespace: postgres-mcp
  labels:
    app: postgres-mcp
    app.kubernetes.io/name: postgres-mcp
    app.kubernetes.io/part-of: topmate-mcp
spec:
  # PINNED TO 1 — do not raise without a shared session store.
  # External callers use the stateful /sse transport, whose session_id->stream
  # map is in-memory per pod. ALB lb_cookie stickiness does NOT pin them: the
  # EventSource GET and the message POSTs are separate requests that never replay
  # the AWSALB cookie, so with >1 replica ~50% of POSTs land on the wrong pod
  # (404 "Could not find session") and the client handshake times out at 30s.
  # Re-enable scale-out only after external callers move to the stateless /mcp
  # (streamable_http) path OR /sse sessions are backed by a shared store (Redis).
  replicas: 1
  selector:
    matchLabels:
      app: postgres-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app: postgres-mcp
        app.kubernetes.io/name: postgres-mcp
    spec:
      serviceAccountName: postgres-mcp-sa
      containers:
        - name: postgres-mcp
          image: 072528252688.dkr.ecr.ap-south-1.amazonaws.com/topmate-postgres-mcp:latest
          args:
            - "--transport=sse"
            - "--sse-host=0.0.0.0"
            - "--sse-port=8000"
            - "--access-mode=restricted"
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: database-uri
            - name: ACCESS_MODE
              value: "restricted"
            - name: TRANSPORT
              value: "sse"
            - name: PORT
              value: "8000"
            # POOL: per-replica psycopg pool sizing (tunable without rebuild).
            # ⚠ Raise DB_POOL_MAX_SIZE (e.g. 30) only after verifying RDS
            # max_connections + pg_stat_activity headroom (replica shared w/ Django).
            - name: DB_POOL_MIN_SIZE
              value: "5"
            - name: DB_POOL_MAX_SIZE
              value: "20"
            - name: DB_POOL_TIMEOUT
              value: "10.0"
            - name: TOPMATE_LOGIC_HUB_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: logic-hub-url
            - name: TOPMATE_LOGIC_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: logic-hub-api-key
            - name: ALLOWED_IPS
              valueFrom:
                configMapKeyRef:
                  name: postgres-mcp-allowlist
                  key: allowed-ips
            # Static Bearer token that bypasses the IP allowlist (shared with db-mcp).
            # Holders can reach postgres-mcp from any IP (e.g. staging EC2, CI).
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: auth-token
                  optional: true
            # LOOP-664 M1: per-person auth. Flip to "true" only after tokens
            # are minted and distributed (see docs/PERSON_AUTH.md).
            - name: PERSON_AUTH_ENABLED
              value: "false"
            - name: PERSON_TOKENS
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: person-tokens
                  optional: true
            # --- Caller-scoped access (Loop end-user identity forwarding) ---
            # Validates Authorization: Token <x> against galactus /profile/.
            # postgres-mcp is admin-only: any non-superadmin scope is 403'd.
            - name: CALLER_SCOPE_ENABLED
              value: "true"
            - name: GALACTUS_PROFILE_URL
              value: "https://api.galactus.run/profile/"
            - name: SUPERADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: superadmin-emails
                  optional: true
            - name: SUPERADMIN_TOKENS
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: superadmin-tokens
                  optional: true
            # --- G1/G3: Loop-signed identity JWT (verify side) ---
            # Flip REQUIRE_SIGNED_IDENTITY to "true" only after Loop ships signing
            # (sends X-Identity-JWT). See docs/LOOP_SIGNED_IDENTITY_CONTRACT.md.
            - name: REQUIRE_SIGNED_IDENTITY
              value: "false"
            - name: IDENTITY_JWT_AUDIENCE
              value: "topmate-mcp"
            - name: IDENTITY_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: topmate-bi-secrets
                  key: identity-jwt-public-key
                  optional: true
            # LOOP-664 M3: multi-DB router (proxy to sibling per-DB MCPs).
            # Flip to "true" only after DOMAIN_REGISTRY_JSON entries are verified
            # reachable (see docs) and svc-internal-mcp-token is minted/distributed.
            - name: MULTI_DOMAIN_ENABLED
              value: "false"
            # Service DNS is intra-namespace (postgres-mcp), so short names resolve.
            # All Services below expose port 80 -> targetPort 8000 (no :8000 suffix
            # needed on base_url); downstream client appends /sse or /mcp itself.
            # NOTE(rollout): instagram-mcp-service is deployed separately (not in
            # this manifest set) — verify it exposes port 80 like the others
            # (`kubectl -n postgres-mcp get svc instagram-mcp-service`) before
            # flipping MULTI_DOMAIN_ENABLED to "true".
            - name: DOMAIN_REGISTRY_JSON
              value: >-
                {"igdm":{"base_url":"http://instagram-mcp-service","token_env":"SVC_INTERNAL_MCP_TOKEN","database":"instagram_auto_dm"},"fin_ledger":{"base_url":"http://postgres-mcp-v2-ledger-service","token_env":"SVC_INTERNAL_MCP_TOKEN","database":"ledger_db"},"fin_payment":{"base_url":"http://postgres-mcp-v2-payment-service","token_env":"SVC_INTERNAL_MCP_TOKEN","database":"payment_db"},"fin_payout":{"base_url":"http://postgres-mcp-v2-payout-service","token_env":"SVC_INTERNAL_MCP_TOKEN","database":"payout_db"}}
            - name: SVC_INTERNAL_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-secrets
                  key: svc-internal-mcp-token
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1500m"   # S1: raise the 0.5-vCPU cap so each replica can drive its pool
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
