apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-mcp-pdb
  namespace: postgres-mcp
  labels:
    app: postgres-mcp
    app.kubernetes.io/part-of: topmate-mcp
spec:
  # INFRA: maxUnavailable scales with replica count and allows draining 1 of N
  # during consolidation; minAvailable:1 at replicas:1 blocked ALL voluntary
  # eviction (disruptionsAllowed=0) — a SPOF amplifier now that we run >1 replica.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: postgres-mcp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: db-mcp-server-pdb
  namespace: postgres-mcp
  labels:
    app: db-mcp-server
    app.kubernetes.io/part-of: topmate-mcp
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: db-mcp-server
