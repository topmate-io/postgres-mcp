apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: postgres-mcp
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: topmate-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
      annotations:
        # INFRA: don't let Karpenter evict the single Redis (cache + rate-limiter
        # + single-flight store) mid-flight during node consolidation.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      # INFRA: keep Redis off spot capacity so it isn't reclaimed.
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      terminationGracePeriodSeconds: 10
